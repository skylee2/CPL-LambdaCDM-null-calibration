    expression: "w0 + wa < 0"
    rationale: "keeps CPL dark energy subdominant at early times for the compressed-CMB approximation"
emulator_domain:
  omega_m: [0.11, 0.19]
  omega_b: [0.019, 0.026]
boundary_tolerance_fraction: 1.0e-5
optimizer:
  repeated_minimum_chi2_tolerance: 1.0e-4
  zero_noise_delta_chi2_tolerance: 1.0e-5
  n_random_starts_lcdm: 4
  n_random_starts_cpl: 8
  seed: 20260725
