schema_version: 1
parameter_order: [omega_m, omega_b, H0, w0, wa, DeltaM]
parameters:
  omega_m: {type: uniform, lower: 0.115, upper: 0.185, fiducial: 0.147}
  omega_b: {type: uniform, lower: 0.0200, upper: 0.0255, fiducial: 0.02237}
  H0: {type: uniform, lower: 55.0, upper: 85.0, fiducial: 70.0}
  w0: {type: uniform, lower: -2.0, upper: -0.3, fiducial: -1.0}
  wa: {type: uniform, lower: -2.0, upper: 1.0, fiducial: 0.0}
  DeltaM: {type: uniform, lower: -1.0, upper: 1.0, fiducial: 0.0}
constraints:
